spring.application.name=ai-agent-service
server.port=8083
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.hostname=localhost
eureka.instance.instance-id=${spring.application.name}:${server.port}
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
spring.cloud.config.request-connect-timeout=1000
spring.cloud.config.request-read-timeout=2000

# Programmatic MCP clients attach authentication to every HTTP request.
spring.ai.mcp.client.enabled=false
bank.mcp.account-url=${ACCOUNT_MCP_URL:http://localhost:8081}
bank.mcp.transaction-url=${TRANSACTION_MCP_URL:http://localhost:8082}
bank.mcp.auth-token=${MCP_AUTH_TOKEN:}
bank.agent.auth-token=${AGENT_AUTH_TOKEN:${MCP_AUTH_TOKEN:}}

# No model is created until the llm profile is explicitly enabled.
spring.ai.model.chat=none
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-5-mini}
spring.ai.openai.chat.options.temperature=1.0
spring.ai.retry.max-attempts=1
server.error.include-message=always
