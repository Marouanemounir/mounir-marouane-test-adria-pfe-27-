spring.application.name=transaction-service
server.port=8082
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.hostname=localhost
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.client.registry-fetch-interval-seconds=5
eureka.instance.initial-instance-info-replication-interval-seconds=5
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
spring.cloud.config.request-connect-timeout=1000
spring.cloud.config.request-read-timeout=2000
spring.datasource.url=jdbc:h2:mem:transactiondb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false
management.endpoints.web.exposure.include=health,info,circuitbreakers
# Local fallback; Config Server's imported shared configuration takes precedence.
bank.transaction.max-amount=1000
# Empty URL selects Eureka. Set ACCOUNT_SERVICE_URL or bank.services.account-url for direct HTTP.
bank.services.account-url=${ACCOUNT_SERVICE_URL:}
spring.cloud.loadbalancer.retry.enabled=false
spring.cloud.openfeign.okhttp.enabled=true
spring.cloud.openfeign.httpclient.hc5.enabled=false
spring.cloud.openfeign.client.config.account-service.connectTimeout=1000
spring.cloud.openfeign.client.config.account-service.readTimeout=2000
# Resilience4j is applied explicitly in AccountGateway (one circuit, no AOP self-invocation).
spring.cloud.openfeign.circuitbreaker.enabled=false
resilience4j.circuitbreaker.instances.accountService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.accountService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.accountService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.accountService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.accountService.ignoreExceptions=ma.enset.transactionservice.service.exception.BusinessException
