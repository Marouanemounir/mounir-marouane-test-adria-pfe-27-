spring.application.name=transaction-service
# Existing banking tests run without an external Kafka broker.
spring.kafka.consumer.group-id=adria-transaction-logging
spring.kafka.listener.auto-startup=false
spring.kafka.admin.auto-create=false
eureka.client.enabled=false
spring.cloud.config.enabled=false
spring.datasource.url=jdbc:h2:mem:transaction-tests;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
bank.transaction.max-amount=1000
bank.services.account-url=http://localhost:1
spring.cloud.openfeign.okhttp.enabled=true
spring.cloud.openfeign.httpclient.hc5.enabled=false
spring.cloud.openfeign.client.config.account-service.connectTimeout=300
spring.cloud.openfeign.client.config.account-service.readTimeout=300
spring.cloud.openfeign.circuitbreaker.enabled=false
resilience4j.circuitbreaker.instances.accountService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.accountService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.accountService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.accountService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.accountService.ignoreExceptions=ma.enset.transactionservice.service.exception.BusinessException
